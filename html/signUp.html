<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://kit.fontawesome.com/82bc775c5d.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/signUp.css">
        <script src="../js/signUp.js" defer></script>
    </head>
    <body>
        <header>
            <div class="logo-sec">
                <p><button><i class="fa-regular fa-camera"></i></button> Pixel<span>Flow</span></p>
            </div>
        </header>
        <div class="main">
            <form>
                <button class="key"><i class="fa-brands fa-dropbox key-icon"></i></button>
                <h2>Create an Account</h2>
                <p>Get started with your personal gallery collection.</p>
                <div class="name">
                    <label for="name">Full Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter your full name">
                    <i class="fa-solid fa-user icon"></i>
                    <p class="error"></p>
                </div>
                <div class="email">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email address">
                    <i class="fa-solid fa-envelope icon"></i>
                    <p class="error"></p>
                </div>
                <div class="password">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password">
                    <i class="fa-solid fa-lock icon"></i>
                    <p class="error"></p>
                </div>
                <div class="confirm">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" name="confirm" id="confirm" placeholder="Confirm your password">
                    <i class="fa-solid fa-lock icon"></i>
                    <p class="error"></p>
                </div>
                <button type="button" class="sign"><i class="fa-regular fa-user"></i> Sign Up</button>
                <p class="signup">Already have an account? <a href="signIn.html">Sign In</a></p>
            </form>
        </div>
    </body>
</html>
