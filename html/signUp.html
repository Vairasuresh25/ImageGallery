<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://kit.fontawesome.com/82bc775c5d.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/signUp.css">
        <script src="../js/signUp.js" defer></script>
    </head>
    <body>
        <div class="main">
            <header>
                <div class="logo-sec">
                    <p ><button><i class="fa-regular fa-camera"></i></button> My Image Gallery</p>
                </div>
                <div class="top-right">
                    <p>Already have an account?</p>
                    <button>Sign In</button>
                </div>
            </header>
            <main>
                <div class="image">
                    <h2>Join Our Image Gallery!</h2>
                    <p>Create your account and start exploring beautiful images today.</p>
                </div>
                <form>
                    <h2>Create Account</h2>
                    <p>Sign up to start journey with us!</p>
                    <div class="name">
                        <label for="name">Full Name <span>*</span></label>
                        <input type="text" name="name" id="name" placeholder="Enter your full name" required>
                        <i class="fa-solid fa-user icon"></i>
                    </div>
                    <div class="email">
                        <label for="email">Email Address <span>*</span></label>
                        <input type="email" name="email" id="email" placeholder="Enter your email address" required>
                        <i class="fa-solid fa-envelope icon"></i>
                    </div>
                    <div class="password">
                        <label for="password">Password <span>*</span></label>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-lock icon"></i>
                    </div>
                    <div class="confirm">
                        <label for="confirm">Confirm Password <span>*</span></label>
                        <input type="password" name="confirm" id="confirm" placeholder="Confirm your password" required>
                        <i class="fa-solid fa-lock icon"></i>
                    </div>
                    <button type="submit"><i class="fa-regular fa-user"></i> Sign Up</button>
                </form>
            </main>
        </div>
    </body>
</html>
