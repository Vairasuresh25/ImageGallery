<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PixelFlow | Home Page</title>
        <link rel="stylesheet" href="../css/main.css">
        <script src="https://kit.fontawesome.com/82bc775c5d.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <script src="../js/main.js" defer></script>
    </head>
    <body>
        <header>
            <div class="logo-sec">
                <a href="main.html"><button><i class="fa-regular fa-camera"></i></button> Pixel<span>Flow</span></a>
            </div>
            <nav>
                <button class="home">Home</button>
                <button class="my-gallery">My Gallery</button>
                <button class="favorite">Favorites</button>
                <button class="my-profile">My Profile</button>
            </nav>
            <div class="profile">
                <button class="upload"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Image</button>
                <button class="initial">S</button>
                <p class="user-name"></p>
                <p class="sign" title="Logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></p>
            </div>
        </header>
        <main>
            <div class="top">
                <button class="image"><img src="../images/user.jpg"></button>
                <div class="welcome">
                    <h2>Welcome, <span></span></h2>
                    <p>Explore, curate and archive your personal vault of ultra-high-resolution photographs and assets.</p>
                    <button class="mail"></button>
                    <i class="fa-solid fa-envelope mail-icon"></i>
                </div>
            </div>
            <div class="search">
                <input type="search" placeholder="Search image by name...">
                <i class="fa-solid fa-magnifying-glass input-icon"></i>
            </div>
            <label for="category"></label>
            <div class="category">
                <label class="all"><input type="radio" name="category" checked>All Images</label>
                <label class="family"><input type="radio" name="category">Family</label>
                <label class="friends"><input type="radio" name="category">Friends</label>
                <label class="nature"><input type="radio" name="category">Nature</label>
                <label class="animals"><input type="radio" name="category">Animals</label>
                <label class="birds"><input type="radio" name="category">Birds</label>
                <label class="travel"><input type="radio" name="category">Travel</label>
                <label class="food"><input type="radio" name="category">Food</label>
                <label class="technology"><input type="radio" name="category">Technology</label>
                <label class="filters-option"><input type="radio" name="category">Filters</label>
                <label class="other"><input type="radio" name="category">Other</label>
            </div>
            <div class="images">
                <p class="head"><i class="fa-regular fa-image image-icon"></i> My Images</p>
                <div></div>
            </div>
        </main>
        <footer>
            <p><i class="fa-regular fa-copyright"></i> 2026 PixelFlox Gallery, Inc. All rights reserved.</p>
        </footer>
        <div class="upload-form">
            <h2>Upload an Image</h2>
            <div class="file">
                <label for="file">Choose the Image</label>
                <input type="file" name="file" accept="image/*" class="file-button">
            </div>
            <div class="image-name">
                <label for="image-name">Image Name</label>
                <input type="text" name="image-name">
            </div>
            <div class="category-list">
                <label for="category-list">Category</label>
                <select name="category" id="category-list">
                    <option value="">Choose an option</option>
                    <option value="family">Family</option>
                    <option value="friends">Friends</option>
                    <option value="nature">Nature</option>
                    <option value="animals">Animals</option>
                    <option value="birds">Birds</option>
                    <option value="travel">Travel</option>
                    <option value="food">Food</option>
                    <option value="technology">Technology</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <button class="image-upload">Upload</button>
            <button class="cancel">Cancel</button>
        </div>
        <div class="preview-box">
            <div class="preview-img-name">
                <p></p>
            </div>
            <div class="preview-main-box">
                <button class="previous"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="preview-img"></div>
                <button class="next"><i class="fa-solid fa-chevron-right"></i></button>
                <button class="close"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="light-box-box">
            <div class="light-img-name">
                <p></p>
            </div>
            <div class="main-box">
                <button class="light-previous"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="light-img"></div>
                <button class="light-next"><i class="fa-solid fa-chevron-right"></i></button>
                <button class="light-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="bottom-box"></div>
        </div>
        <div class="filter">
            <p class="filter-img-name"></p>
            <div class="filter-box"></div>
            <div class="filters">
                <div class="filter1"></div>
                <div class="filter2"></div>
                <div class="filter3"></div>
                <div class="filter4"></div>
                <div class="filter5"></div>
            </div>
            <button class="save">Save</button>
            <button class="cancel-filter">Cancel</button>
        </div>
    </body>
</html>
