<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://kit.fontawesome.com/82bc775c5d.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/signIn.css">
        <script src="../js/signIn.js" defer></script>
    </head>
    <body>
        <div class="main">
            <header>
                <div class="logo-sec">
                    <p ><button><i class="fa-regular fa-camera"></i></button> My Image Gallery</p>
                </div>
                <div class="top-right">
                    <p>Don't have an account?</p>
                    <button>Sign Up</button>
                </div>
            </header>
            <main>
                <div class="image">
                    <h2>Discover Beatiful Imaages</h2>
                    <p>Explore, filter and enjoy Thousands of amazing photos.</p>
                </div>
                <div class="form">
                    <h2>Welcome Back!</h2>
                    <p>Sign in to your account to continue exploring mazing images.</p>
                    <div class="email">
                        <label for="email">Email Address <span>*</span></label>
                        <input type="email" name="email" id="email" placeholder="Enter your email address" required>
                        <i class="fa-solid fa-envelope icon"></i>
                    </div>
                    <div class="password">
                        <label for="password">Password <span>*</span></label>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-lock icon"></i>
                    </div>
                    <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
                </div>
            </main>
        </div>
    </body>
</html>
